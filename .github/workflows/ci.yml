# CI for the LeadFlow AI demo app. Runs typecheck, lint, and the Vitest
# regression suite (mock provider — no API keys needed) on every push/PR.
# Activates automatically once this repo is pushed to GitHub.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
